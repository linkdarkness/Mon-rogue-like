<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mon Roguelike Mobile - Inventaire Grille</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #0d0d0d; 
            color: #f0f0f0; 
            margin: 0; 
            padding: 10px; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .hidden { display: none !important; }
        
        #game-container { 
            width: 100%; 
            max-width: 450px; 
            background: #18181b; 
            padding: 15px; 
            border-radius: 12px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.7); 
            border: 1px solid #27272a;
        }

        h1 { font-size: 1.5rem; text-align: center; margin-top: 5px; color: #bb86fc; }
        h2 { font-size: 1rem; text-align: center; background: #27272a; padding: 10px; border-radius: 8px; margin: 10px 0; color: #03dac6; line-height: 1.4; }
        
        button { 
            background: #6200ee; 
            color: white; 
            border: none; 
            padding: 12px; 
            margin: 4px 0; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 0.95rem; 
            font-weight: bold;
            width: 100%;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:active { transform: scale(0.98); }
        button:hover { background: #3700b3; }
        button:disabled { background: #3f3f46; color: #71717a; cursor: not-allowed; box-shadow: none; }

        .class-btn { background: #27272a; border: 1px solid #bb86fc; text-align: left; padding: 15px; }
        .class-btn span { display: block; font-size: 0.85rem; color: #a1a1aa; font-weight: normal; margin-top: 4px; }

        /* Grille d'inventaire en emplacements carrés */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            max-height: 130px;
            overflow-y: auto;
            padding: 2px;
        }

        .inventory-slot {
            aspect-ratio: 1;
            background: #27272a;
            border: 1px solid #3f3f46;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            font-size: 1.5rem;
            transition: background 0.2s, border-color 0.2s;
        }
        .inventory-slot:hover {
            background: #3f3f46;
            border-color: #bb86fc;
        }
        .inventory-slot.empty {
            cursor: default;
            background: #141416;
            border-color: #222226;
        }

        .item-count {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 0.7rem;
            background: rgba(0, 0, 0, 0.75);
            color: #03dac6;
            padding: 1px 4px;
            border-radius: 4px;
            font-weight: bold;
        }

        .log-box { 
            background: #09090b; 
            padding: 10px; 
            height: 110px; 
            overflow-y: auto; 
            text-align: left; 
            font-family: monospace; 
            font-size: 0.8rem;
            border: 1px solid #27272a; 
            border-radius: 8px; 
            margin-top: 10px; 
            line-height: 1.3;
        }

        .section-box { 
            background: #202024; 
            padding: 10px; 
            border-radius: 8px; 
            margin-top: 10px; 
            border: 1px solid #2f2f35;
        }

        .section-box h3 { margin: 0 0 6px 0; font-size: 0.85rem; color: #a1a1aa; text-transform: uppercase; letter-spacing: 0.5px; }
        
        #encounter-text { 
            font-size: 0.95rem; 
            text-align: center; 
            margin: 8px 0; 
            font-weight: 500;
            color: #ffb74d; 
        }

        .legacy-box { 
            background: #23122b; 
            border: 1px solid #bb86fc; 
            padding: 12px; 
            margin-bottom: 15px; 
            border-radius: 8px; 
            font-size: 0.9rem;
            text-align: center;
        }

        .equipment-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            font-size: 0.8rem;
        }

        .eq-slot {
            background: #18181b;
            border: 1px solid #2f2f35;
            padding: 6px 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Modal de Comparaison */
        #modal-compare {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 15px;
        }
        .modal-content {
            background: #18181b;
            border: 1px solid #bb86fc;
            padding: 15px;
            border-radius: 10px;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .compare-box-container {
            display: flex;
            gap: 8px;
            margin: 12px 0;
            text-align: left;
        }
        .compare-card {
            flex: 1;
            background: #27272a;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.78rem;
            border: 1px solid #3f3f46;
        }
        .compare-card h4 { margin: 0 0 4px 0; color: #03dac6; font-size: 0.82rem; }
        
        .stat-diff-pos { color: #4ade80; font-weight: bold; }
        .stat-diff-neg { color: #f87171; font-weight: bold; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- ÉCRAN DE SÉLECTION DE CLASSE -->
        <div id="screen-class-select">
            <h1>Roguelite Mobile</h1>
            <div id="legacy-info" class="legacy-box hidden">
                <p id="legacy-text" style="margin: 0; color: #e8d7ff;"></p>
            </div>
            <p style="text-align: center; color: #a1a1aa; font-size: 0.9rem;">Choisissez votre archétype :</p>
            
            <button class="class-btn" onclick="startGame('Guerrier')">
                🛡️ Guerrier
                <span>PV: 120 | Force: 15</span>
            </button>
            <button class="class-btn" onclick="startGame('Mage')">
                🔮 Mage
                <span>PV: 80 | Magie: 22</span>
            </button>
            <button class="class-btn" onclick="startGame('Voleur')">
                🗡️ Voleur
                <span>PV: 100 | Agilité: 18</span>
            </button>
        </div>

        <!-- ÉCRAN DE JEU -->
        <div id="screen-game" class="hidden">
            <h2 id="player-status">Statut</h2>
            
            <!-- ÉQUIPEMENT ACTUEL -->
            <div class="section-box">
                <h3>Équipement Actuel</h3>
                <div class="equipment-grid" id="equipment-display">
                    <!-- Généré dynamiquement -->
                </div>
            </div>

            <div class="section-box" style="text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center;">
                <p id="encounter-text">Vous entrez dans le donjon...</p>
            </div>

            <div class="section-box">
                <h3>Actions</h3>
                <div id="action-buttons">
                    <button id="btn-explore" onclick="exploreRoom()">Explorer une salle</button>
                    <button id="btn-next-floor" onclick="nextFloor()" disabled>Monter l'escalier</button>
                </div>
            </div>

            <div class="section-box">
                <h3>Inventaire</h3>
                <div class="inventory-grid" id="inventory-buttons">
                    <!-- Généré dynamiquement sous forme de grille -->
                </div>
            </div>

            <div class="log-box" id="log-box"></div>
        </div>
    </div>

    <!-- MODALE DE COMPARAISON D'OBJET -->
    <div id="modal-compare" class="hidden">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-top:0; color:#bb86fc;">Comparaison d'équipement</h3>
            <div class="compare-box-container">
                <div class="compare-card" id="card-current">
                    <h4>Actuel</h4>
                    <div id="current-gear-info">Aucun</div>
                </div>
                <div class="compare-card" id="card-new" style="border-color: #bb86fc;">
                    <h4>Nouveau</h4>
                    <div id="new-gear-info">Objet</div>
                </div>
            </div>
            <div id="modal-action-buttons">
                <button onclick="confirmEquip()" style="background: #10b981; margin-bottom: 4px;">Équiper</button>
                <button onclick="discardItem()" style="background: #ef4444; margin-bottom: 4px;">Jeter l'objet</button>
                <button onclick="closeModal()" style="background: #52525b;">Fermer</button>
            </div>
        </div>
    </div>

    <script>
        let player = {};
        let currentMonster = null;
        let isBossEncounter = false;
        let selectedInventoryIndex = null;
        let dungeonState = {
            floor: 1,
            roomsCleared: 0,
            maxRoomsPerFloor: 4
        };

        const icons = {
            casque: '🪖',
            arme: '⚔️',
            torse: '🛡️',
            gants: '🧤',
            bottes: '🥾',
            potion: '🧪'
        };

        const classes = {
            'Guerrier': { hp: 120, maxHp: 120, atk: 15, class: 'Guerrier' },
            'Mage': { hp: 80, maxHp: 80, atk: 22, class: 'Mage' },
            'Voleur': { hp: 100, maxHp: 100, atk: 18, class: 'Voleur' }
        };

        let legacyData = JSON.parse(localStorage.getItem('rogue_legacy')) || null;

        window.onload = function() {
            if (legacyData) {
                const legacyBox = document.getElementById('legacy-info');
                const legacyText = document.getElementById('legacy-text');
                legacyBox.classList.remove('hidden');
                legacyText.innerText = `✨ Héritage actif : +${legacyData.bonusAtk} ATK | +${legacyData.bonusHp} PV Max`;
            }
        };

        function startGame(className) {
            let base = classes[className];
            let bonusAtk = legacyData ? legacyData.bonusAtk : 0;
            let bonusHp = legacyData ? legacyData.bonusHp : 0;

            player = { 
                class: className,
                level: 1, 
                xp: 0, 
                maxXp: 30,
                baseMaxHp: base.maxHp + bonusHp,
                baseAtk: base.atk + bonusAtk,
                maxHp: base.maxHp + bonusHp,
                hp: base.maxHp + bonusHp,
                atk: base.atk + bonusAtk,
                equipment: {
                    casque: null,
                    arme: null,
                    torse: null,
                    gants: null,
                    bottes: null
                },
                inventory: [] 
            };
            
            dungeonState = { floor: 1, roomsCleared: 0, maxRoomsPerFloor: 4 };

            document.getElementById('screen-class-select').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');
            log(`Vous avez choisi ${className}. Bon courage !`);
            updateStatus();
            setExplorationMode();
        }

        function addItemToInventory(newItem) {
            let existingItem = player.inventory.find(i => i.name === newItem.name);
            if (existingItem) {
                existingItem.quantity = (existingItem.quantity || 1) + 1;
            } else {
                newItem.quantity = 1;
                player.inventory.push(newItem);
            }
        }

        function recalculateStats() {
            let bonusHp = 0;
            let bonusAtk = 0;

            for (let slot in player.equipment) {
                let eq = player.equipment[slot];
                if (eq) {
                    bonusHp += (eq.hp || 0);
                    bonusAtk += (eq.atk || 0);
                }
            }

            let oldMax = player.maxHp;
            player.maxHp = player.baseMaxHp + bonusHp;
            player.atk = player.baseAtk + bonusAtk;

            if (player.maxHp > oldMax) {
                player.hp += (player.maxHp - oldMax);
            }
            if (player.hp > player.maxHp) {
                player.hp = player.maxHp;
            }
        }

        function updateStatus() {
            recalculateStats();
            document.getElementById('player-status').innerText = 
                `${player.class} (Nv.${player.level}) | Étage ${dungeonState.floor}\nPV: ${player.hp}/${player.maxHp} | ATK: ${player.atk} | XP: ${player.xp}/${player.maxXp}`;
            
            updateEquipmentUI();
            updateInventoryUI();
        }

        function updateEquipmentUI() {
            const eqDisplay = document.getElementById('equipment-display');
            let eq = player.equipment;
            
            const slotsConfig = [
                { key: 'casque', label: 'Casque' },
                { key: 'arme', label: 'Arme' },
                { key: 'torse', label: 'Torse' },
                { key: 'gants', label: 'Gants' },
                { key: 'bottes', label: 'Bottes' }
            ];

            eqDisplay.innerHTML = '';
            slotsConfig.forEach(s => {
                let item = eq[s.key];
                let text = item ? `${item.name}<br><span style="color:#a1a1aa; font-size:0.7rem;">${item.atk ? '+' + item.atk + ' ATK ' : ''}${item.hp ? '+' + item.hp + ' PV' : ''}</span>` : 'Aucun';
                let div = document.createElement('div');
                div.className = 'eq-slot';
                div.style.gridColumn = s.key === 'bottes' ? 'span 2' : 'auto';
                div.innerHTML = `<span style="font-size: 1.2rem;">${icons[s.key]}</span> <div style="overflow:hidden; text-overflow:ellipsis;"><strong>${s.label}:</strong><br>${text}</div>`;
                eqDisplay.appendChild(div);
            });
        }

        function updateInventoryUI() {
            const invContainer = document.getElementById('inventory-buttons');
            invContainer.innerHTML = '';

            // Affichage d'une grille fixe (par exemple 8 emplacements minimum pour faire joli)
            const minSlots = 8;
            let totalSlots = Math.max(minSlots, Math.ceil(player.inventory.length / 4) * 4);

            for (let i = 0; i < totalSlots; i++) {
                let slotDiv = document.createElement('div');
                
                if (i < player.inventory.length) {
                    let item = player.inventory[i];
                    let icon = icons[item.type] || icons[item.slot] || '📦';
                    let qtyBadge = item.quantity > 1 ? `<span class="item-count">x${item.quantity}</span>` : '';
                    
                    slotDiv.className = 'inventory-slot';
                    slotDiv.title = `${item.name}${item.quantity > 1 ? ' (x' + item.quantity + ')' : ''}`;
                    slotDiv.innerHTML = `${icon}${qtyBadge}`;
                    slotDiv.onclick = () => handleItemClick(i);
                } else {
                    slotDiv.className = 'inventory-slot empty';
                }
                
                invContainer.appendChild(slotDiv);
            }
        }

        function handleItemClick(index) {
            let item = player.inventory[index];
            
            if (item.type === 'potion') {
                player.hp = Math.min(player.maxHp, player.hp + item.value);
                log(`Potion bue (+${item.value} PV).`);
                
                item.quantity--;
                if (item.quantity <= 0) {
                    player.inventory.splice(index, 1);
                }
                updateStatus();
                return;
            }

            selectedInventoryIndex = index;
            openCompareModal(item);
        }

        function openCompareModal(newItem) {
            let slot = newItem.slot;
            let currentItem = player.equipment[slot];

            document.getElementById('modal-title').innerText = `Équiper : ${newItem.name}`;

            let currentDiv = document.getElementById('current-gear-info');
            if (currentItem) {
                currentDiv.innerHTML = `<strong>${currentItem.name}</strong><br>ATK: ${currentItem.atk || 0}<br>PV: ${currentItem.hp || 0}`;
            } else {
                currentDiv.innerHTML = `<em>Emplacement vide</em>`;
            }

            let newDiv = document.getElementById('new-gear-info');
            let diffAtk = (newItem.atk || 0) - (currentItem ? (currentItem.atk || 0) : 0);
            let diffHp = (newItem.hp || 0) - (currentItem ? (currentItem.hp || 0) : 0);

            let atkClass = diffAtk > 0 ? 'stat-diff-pos' : (diffAtk < 0 ? 'stat-diff-neg' : '');
            let hpClass = diffHp > 0 ? 'stat-diff-pos' : (diffHp < 0 ? 'stat-diff-neg' : '');

            let atkStr = `ATK: ${newItem.atk || 0} <span class="${atkClass}">(${diffAtk >= 0 ? '+' : ''}${diffAtk})</span>`;
            let hpStr = `PV: ${newItem.hp || 0} <span class="${hpClass}">(${diffHp >= 0 ? '+' : ''}${diffHp})</span>`;

            newDiv.innerHTML = `<strong>${newItem.name}</strong><br>${atkStr}<br>${hpStr}`;

            document.getElementById('modal-compare').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-compare').classList.add('hidden');
            selectedInventoryIndex = null;
        }

        function confirmEquip() {
            if (selectedInventoryIndex === null) return;
            let itemStack = player.inventory[selectedInventoryIndex];
            
            let newItem = { ...itemStack };
            delete newItem.quantity;

            let slot = newItem.slot;
            let previousItem = player.equipment[slot];

            player.equipment[slot] = newItem;

            if (itemStack.quantity > 1) {
                itemStack.quantity--;
                if (previousItem) {
                    addItemToInventory(previousItem);
                }
                log(`Vous équipez ${newItem.name} depuis la pile.`);
            } else {
                if (previousItem) {
                    player.inventory[selectedInventoryIndex] = previousItem;
                    previousItem.quantity = 1;
                    log(`Vous remplacez ${previousItem.name} par ${newItem.name}.`);
                } else {
                    player.inventory.splice(selectedInventoryIndex, 1);
                    log(`Vous équipez ${newItem.name}.`);
                }
            }

            closeModal();
            updateStatus();
        }

        function discardItem() {
            if (selectedInventoryIndex === null) return;
            let itemStack = player.inventory[selectedInventoryIndex];
            
            itemStack.quantity--;
            log(`Vous avez jeté un exemplaire de ${itemStack.name}.`);
            
            if (itemStack.quantity <= 0) {
                player.inventory.splice(selectedInventoryIndex, 1);
            }
            
            closeModal();
            updateStatus();
        }

        function log(message) {
            const box = document.getElementById('log-box');
            box.innerHTML += `> ${message}<br>`;
            box.scrollTop = box.scrollHeight;
        }

        function setExplorationMode() {
            currentMonster = null;
            isBossEncounter = false;
            
            if (dungeonState.roomsCleared >= dungeonState.maxRoomsPerFloor && dungeonState.floor % 5 === 0) {
                document.getElementById('encounter-text').innerText = `⚠️ SALLE DU BOSS DE L'ÉTAGE ${dungeonState.floor} !`;
                let actionDiv = document.getElementById('action-buttons');
                actionDiv.innerHTML = `
                    <button onclick="spawnBoss()" style="background: #e11d48;">Affronter le Boss</button>
                `;
                return;
            }

            document.getElementById('encounter-text').innerText = `Étage ${dungeonState.floor} — Salles : ${dungeonState.roomsCleared}/${dungeonState.maxRoomsPerFloor}`;
            
            let actionDiv = document.getElementById('action-buttons');
            actionDiv.innerHTML = `
                <button id="btn-explore" onclick="exploreRoom()">Explorer une salle</button>
                <button id="btn-next-floor" onclick="nextFloor()" ${dungeonState.roomsCleared >= dungeonState.maxRoomsPerFloor ? '' : 'disabled'}>Monter l'escalier</button>
            `;
        }

        function exploreRoom() {
            let eventRoll = Math.random();

            if (eventRoll < 0.6) {
                spawnMonster();
            } else if (eventRoll < 0.85) {
                let item = getRandomEquipmentOrPotion();
                addItemToInventory(item);
                document.getElementById('encounter-text').innerText = `✨ Trésor trouvé !`;
                log(`Vous découvrez : **${item.name}** !`);
                finishRoom();
            } else {
                let heal = 25;
                player.hp = Math.min(player.maxHp, player.hp + heal);
                document.getElementById('encounter-text').innerText = `💧 Source magique...`;
                log(`Vous buvez l'eau claire et récupérez ${heal} PV.`);
                updateStatus();
                finishRoom();
            }
        }

        function spawnMonster() {
            let difficultyMultiplier = 1 + (dungeonState.floor - 1) * 0.35;

            const baseMonsters = [
                { name: 'Gobelin', hp: 25, atk: 7, xpValue: 12 },
                { name: 'Squelette', hp: 40, atk: 11, xpValue: 20 },
                { name: 'Orc des Cavernes', hp: 60, atk: 15, xpValue: 35 }
            ];

            let template = baseMonsters[Math.floor(Math.random() * baseMonsters.length)];
            
            currentMonster = {
                name: template.name,
                hp: Math.floor(template.hp * difficultyMultiplier),
                maxHp: Math.floor(template.hp * difficultyMultiplier),
                atk: Math.floor(template.atk * difficultyMultiplier),
                xpValue: Math.floor(template.xpValue * difficultyMultiplier)
            };

            document.getElementById('encounter-text').innerText = `⚔️ ${currentMonster.name} (PV: ${currentMonster.hp})`;
            log(`Un féroce ${currentMonster.name} surgit !`);

            let actionDiv = document.getElementById('action-buttons');
            actionDiv.innerHTML = `
                <button onclick="combatAction('fight')">Attaquer</button>
                <button onclick="combatAction('flee')" style="background: #52525b;">Tenter de fuir</button>
            `;
        }

        function spawnBoss() {
            isBossEncounter = true;
            const bossNames = {
                5: 'Seigneur des Abysses',
                10: 'Dragon des Cendres',
                15: 'Roi Liche Immortel',
                20: 'Titan du Chaos'
            };
            let bName = bossNames[dungeonState.floor] || `Seigneur des Ténèbres (Étage ${dungeonState.floor})`;

            currentMonster = {
                name: bName,
                hp: 150 + (dungeonState.floor * 40),
                maxHp: 150 + (dungeonState.floor * 40),
                atk: 20 + (dungeonState.floor * 8),
                xpValue: 100 + (dungeonState.floor * 25)
            };

            document.getElementById('encounter-text').innerText = `👹 BOSS : ${currentMonster.name} (PV: ${currentMonster.hp})`;
            log(`🔥 Le redoutable **${currentMonster.name}** se dresse devant vous !`);

            let actionDiv = document.getElementById('action-buttons');
            actionDiv.innerHTML = `
                <button onclick="combatAction('fight')" style="background: #e11d48;">Combattre le Boss</button>
            `;
        }

        function combatAction(action) {
            if (action === 'fight' && currentMonster) {
                currentMonster.hp -= player.atk;
                log(`Vous infligez ${player.atk} dégâts.`);

                if (currentMonster.hp <= 0) {
                    if (isBossEncounter) {
                        log(`🏆 **VICTOIRE ÉPIQUE !** Vous avez terrassé le ${currentMonster.name} ! (+${currentMonster.xpValue} XP)`);
                        gainXp(currentMonster.xpValue);
                        let bossGear = { name: '✨ Épée Légendaire', slot: 'arme', atk: 15, hp: 30 };
                        addItemToInventory(bossGear);
                        log(`🎁 Butin de boss obtenu : **${bossGear.name}** !`);
                        
                        dungeonState.roomsCleared = dungeonState.maxRoomsPerFloor;
                        setExplorationMode();
                    } else {
                        log(`Victoire ! (+${currentMonster.xpValue} XP)`);
                        gainXp(currentMonster.xpValue);
                        dropLoot();
                        finishRoom();
                    }
                    return;
                }

                player.hp -= currentMonster.atk;
                log(`Le monstre riposte et inflige ${currentMonster.atk} dégâts.`);
                updateStatus();

                if (player.hp <= 0) {
                    handlePlayerDeath();
                }
            } else if (action === 'flee') {
                if (Math.random() < 0.5) {
                    log(`Fuite réussie, mais la salle est perdue.`);
                    finishRoom();
                } else {
                    log(`Échec de la fuite ! Le monstre frappe.`);
                    player.hp -= currentMonster.atk;
                    updateStatus();
                    if (player.hp <= 0) {
                        handlePlayerDeath();
                    }
                }
            }
        }

        function handlePlayerDeath() {
            log(`Vous êtes mort au combat...`);
            
            let savedBonusAtk = Math.floor(player.level * 1.5);
            let savedBonusHp = player.level * 10;

            localStorage.setItem('rogue_legacy', JSON.stringify({
                level: player.level,
                bonusAtk: savedBonusAtk,
                bonusHp: savedBonusHp
            }));

            document.getElementById('action-buttons').innerHTML = `
                <button onclick="location.reload()" style="background: #e11d48;">Recommencer (Héritage gardé)</button>
            `;
        }

        function finishRoom() {
            dungeonState.roomsCleared++;
            updateStatus();
            
            if (dungeonState.roomsCleared >= dungeonState.maxRoomsPerFloor) {
                if (dungeonState.floor % 5 === 0) {
                    log(`⚠️ Le gardien de l'étage bloque l'accès aux escaliers !`);
                } else {
                    log(`🚪 L'escalier vers l'étage supérieur est débloqué !`);
                }
            }
            setExplorationMode();
        }

        function nextFloor() {
            dungeonState.floor++;
            dungeonState.roomsCleared = 0;
            dungeonState.maxRoomsPerFloor += 1; 

            log(`🌟 Vous montez à l'étage ${dungeonState.floor}.`);
            updateStatus();
            setExplorationMode();
        }

        function getRandomEquipmentOrPotion() {
            const itemsPool = [
                { name: '🧪 Potion de Soin', type: 'potion', value: 50 },
                { name: '🪖 Casque en Cuir', slot: 'casque', hp: 15 },
                { name: '🪖 Casque en Fer', slot: 'casque', hp: 30, atk: 2 },
                { name: '🗡️ Dague Rouillée', slot: 'arme', atk: 4 },
                { name: '⚔️ Épée Longue', slot: 'arme', atk: 9 },
                { name: '🛡️ Armure en Cuir', slot: 'torse', hp: 25 },
                { name: '🛡️ Plastron de Plates', slot: 'torse', hp: 50 },
                { name: '🧤 Gants en Tissu', slot: 'gants', atk: 2, hp: 5 },
                { name: '🧤 Gants Barbelés', slot: 'gants', atk: 6 },
                { name: '🥾 Bottes Souples', slot: 'bottes', hp: 10 },
                { name: '🥾 Bottes de Fer', slot: 'bottes', hp: 20 }
            ];
            let template = itemsPool[Math.floor(Math.random() * itemsPool.length)];
            let item = { ...template };
            if (item.type !== 'potion') {
                let scale = 1 + (dungeonState.floor - 1) * 0.2;
                if (item.atk) item.atk = Math.max(1, Math.floor(item.atk * scale));
                if (item.hp) item.hp = Math.max(5, Math.floor(item.hp * scale));
            }
            return item;
        }

        function dropLoot() {
            if (Math.random() < 0.55) {
                let loot = getRandomEquipmentOrPotion();
                addItemToInventory(loot);
                log(`🎁 Butin obtenu : **${loot.name}** !`);
            }
        }

        function gainXp(amount) {
            player.xp += amount;
            while (player.xp >= player.maxXp) {
                player.xp -= player.maxXp;
                player.level++;
                player.baseMaxHp += 20;
                player.hp = player.baseMaxHp;
                player.baseAtk += 4;
                player.maxXp = Math.floor(player.maxXp * 1.5);

                log(`✨ **NIVEAU ${player.level} ATTEINT !** (Base Stats Améliorées)`);
            }
            updateStatus();
        }
    </script>
</body>
