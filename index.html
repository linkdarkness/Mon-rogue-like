<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vampire RPG: Blood & Shadows</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a060a;
      --bg-card: #150d18;
      --bg-card-hover: #221428;
      --accent-red: #8b0000;
      --accent-red-bright: #d90429;
      --accent-gold: #c9a050;
      --accent-gold-bright: #ffea00;
      --text-main: #e2d9f3;
      --text-muted: #8d7a9e;
      --border-color: #3d2449;
      
      --rarity-common: #a0a0a0;
      --rarity-rare: #0088ff;
      --rarity-epic: #a335ee;
      --rarity-legendary: #ff8000;
      --rarity-trinket: #ffb703;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(139, 0, 0, 0.25), transparent 70%),
        radial-gradient(circle at 50% 100%, rgba(20, 5, 25, 0.8), var(--bg-dark));
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 40px;
    }

    h1, h2, h3, h4, .font-cinzel {
      font-family: 'Cinzel', serif;
      letter-spacing: 1px;
    }

    .screen {
      width: 100%;
      max-width: 1100px;
      padding: 15px;
      display: none;
    }

    .screen.active {
      display: block;
    }

    /* Creation Screen */
    #creation-screen {
      max-width: 800px;
      margin: 40px auto;
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      box-shadow: 0 0 30px rgba(0,0,0,0.8), 0 0 15px rgba(139,0,0,0.3);
      border-radius: 12px;
      padding: 30px;
      text-align: center;
    }

    #creation-screen h1 {
      color: var(--accent-red-bright);
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(217, 4, 41, 0.5);
    }

    .subtitle {
      color: var(--text-muted);
      margin-bottom: 30px;
      font-style: italic;
    }

    .form-group {
      margin-bottom: 25px;
      text-align: left;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--accent-gold);
      font-weight: 600;
    }

    .form-control {
      width: 100%;
      padding: 12px 15px;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border 0.3s;
    }

    .form-control:focus {
      border-color: var(--accent-red-bright);
    }

    .clan-selector {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-top: 10px;
    }

    .clan-card {
      background: rgba(0,0,0,0.4);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
    }

    .clan-card:hover {
      border-color: var(--accent-red);
      transform: translateY(-3px);
    }

    .clan-card.selected {
      border-color: var(--accent-red-bright);
      background: rgba(139, 0, 0, 0.2);
      box-shadow: 0 0 15px rgba(217, 4, 41, 0.4);
    }

    .clan-card h3 {
      color: var(--accent-gold);
      margin-bottom: 8px;
    }

    .clan-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .clan-bonus {
      font-size: 0.8rem;
      color: var(--accent-red-bright);
      font-weight: bold;
    }

    .btn-main {
      background: linear-gradient(135deg, #8b0000, #d90429);
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 1.2rem;
      font-family: 'Cinzel', serif;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: all 0.3s;
      margin-top: 20px;
    }

    .btn-main:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(217, 4, 41, 0.6);
    }

    /* Navigation Bar Fixed at Top */
    .main-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      background: rgba(10, 6, 10, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--accent-gold);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 10px 15px;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: rgba(21, 13, 24, 0.8);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Cinzel', serif;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn:hover {
      color: var(--text-main);
      border-color: var(--accent-red);
      background: rgba(139, 0, 0, 0.2);
    }

    .nav-btn.active {
      color: var(--accent-gold-bright);
      border-color: var(--accent-gold);
      background: rgba(201, 160, 80, 0.15);
      box-shadow: 0 0 10px rgba(201, 160, 80, 0.3);
    }

    /* Player Header Dashboard */
    .player-header {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 15px 20px;
      margin-top: 15px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 20px;
      align-items: center;
    }

    .player-avatar {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-red), #200);
      border: 2px solid var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      box-shadow: 0 0 10px rgba(139,0,0,0.5);
    }

    .player-info h2 {
      color: var(--accent-gold);
      font-size: 1.3rem;
    }

    .player-clan {
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .stats-bars {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
    }

    .bar-container {
      background: rgba(0,0,0,0.6);
      border-radius: 10px;
      height: 12px;
      width: 100%;
      max-width: 280px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .bar-fill {
      height: 100%;
      transition: width 0.3s ease;
    }

    .bar-fill.hp { background: linear-gradient(90deg, #8b0000, #ff4d4d); }
    .bar-fill.xp { background: linear-gradient(90deg, #4a00e0, #8e2de2); }
    .bar-fill.energy { background: linear-gradient(90deg, #b7094c, #ff5400); }

    .bar-text {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 2px #000;
    }

    .player-resources {
      display: flex;
      gap: 15px;
    }

    .resource-item {
      text-align: right;
    }

    .resource-label {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .resource-value {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-gold);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* ===================================================
       CHARACTER SHEET TAB (SILHOUETTE & STATS)
    =================================================== */
    .character-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media(min-width: 768px) {
      .character-layout {
        grid-template-columns: 1.2fr 1fr;
      }
    }

    .section-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 20px;
    }

    .section-box h3 {
      color: var(--accent-gold);
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.1rem;
    }

    /* Paper Doll Silhouette Grid */
    .paper-doll-container {
      position: relative;
      background: radial-gradient(circle at center, rgba(30,15,35,0.8) 0%, rgba(10,6,10,0.95) 100%);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 420px;
      justify-content: center;
    }

    .doll-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      width: 100%;
      max-width: 380px;
      align-items: center;
      justify-items: center;
    }

    .doll-slot {
      background: rgba(0,0,0,0.5);
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      width: 85px;
      height: 85px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5px;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }

    .doll-slot.has-item {
